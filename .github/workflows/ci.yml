name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # mobile/ is its own pnpm root (mobile/pnpm-workspace.yaml); the lint and
      # type checks read its dependencies' types.
      - run: pnpm --dir mobile install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check
      # Playwright drives the Chrome that the runner image already has.
      - run: pnpm e2e
