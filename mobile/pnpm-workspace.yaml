# eas-cli's dependencies; neither install script is needed (dtrace-provider is
# optional tracing, protobufjs only prints a notice).
allowBuilds:
  dtrace-provider: false
  protobufjs: false
minimumReleaseAgeExclude:
  - "@expo/cli@58.1.21"
  - "@expo/metro-config@58.0.23"
  - "@expo/router-server@58.0.23"
  - babel-preset-expo@58.0.26
  - expo-file-system@58.0.14
  - expo-router@58.0.32
  - expo@58.0.26
# The Expo app is its own pnpm root, apart from the Worker's workspace at the
# repository root. React Native's CMake builds on Windows fail on pnpm's
# symlinked node_modules ("build.ninja still dirty"), so this install is
# hoisted (a flat node_modules, as npm makes), and the Worker keeps isolated
# installs.
nodeLinker: hoisted
